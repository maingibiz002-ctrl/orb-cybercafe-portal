<!-- templates/navbar.html -->
{% load static %}
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">

<nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center fw-bold text-white" href="{% url 'home' %}">
            <span class="brand-icon me-2"><i class="bi bi-wifi"></i></span>
            Orb Cyber Cafe
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link custom-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                        Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link custom-nav-link {% if request.resolver_match.url_name == 'solutions' %}active{% endif %}" href="{% url 'solutions' %}">
                        Digital Solutions
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link custom-nav-link {% if request.resolver_match.url_name == 'courses' %}active{% endif %}" href="{% url 'courses' %}">
                        Tech Courses
                    </a>
                </li>
                <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                    <a class="btn nav-portal-btn px-3 py-2" href="{% url 'guest_portal' %}">
                        <i class="bi bi-lightning-charge-fill me-1"></i> Buy Wi-Fi
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
